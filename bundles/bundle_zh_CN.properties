liquid.yuansu-oxygen.name = 氧气
liquid.yuansu-oxygen.description = 氧气，水电解产物之一，无色无味的气体，支持燃烧和生命活动，可用于氧化反应和医疗用途。
liquid.yuansu-protium.name = 氕气
liquid.yuansu-protium.description = 氕气（轻氢），基础能源气体，可做燃料、化工原料；聚变反应很难直接使用，需要分离氘氚。
block.yuansu-protium-separator.name = 氕气分离机
block.yuansu-protium-separator.description = 通过电解分离工艺，从氢气中提取高纯度氕气，是同位素分离的基础设备。

liquid.yuansu-deuterium.name = 氘气
liquid.yuansu-deuterium.description = 氘气（重氢），氢的稳定同位素，核聚变的主要燃料之一，可用于中子慢化剂和特种化工，在自然界中含量极低，需多级精馏分离。
block.yuansu-deuterium-separator.name = 氘气分离机
block.yuansu-deuterium-separator.description = 通过多级精馏工艺，从氢气中提取稀有氘气，效率较低，需要玻璃等耐腐蚀材料。

liquid.yuansu-tritium.name = 氚气
liquid.yuansu-tritium.description = 氚气（超重氢），氢的放射性同位素，核聚变的关键燃料，半衰期约12.3年，需通过人工辐照或从氢气中极微量分离获得，具有微弱放射性。
block.yuansu-tritium-separator.name = 氚气分离机
block.yuansu-tritium-separator.description = 通过高精度同位素分离工艺，从氢气中提取微量氚气，需要 surge 合金等高级材料，产量极低。

block.yuansu-serpulo-electrolyzer.name = 电解制氢机
block.yuansu-serpulo-electrolyzer.description = 塞普罗专用设备，通过电解水同时制取氢气和氧气（比例2:1），为同位素分离产业链提供原料。

status.yuansu-radiation.name = 辐射
status.yuansu-radiation.description = 放射性物质造成的持续伤害，降低单位生命恢复和移动速度，由氚气等放射性物质施加。
