liquid.yuansu-protium.name = 氕气
liquid.yuansu-protium.description = 氢的最轻同位素，仅含一个质子，从氢气中分离提纯得到。
block.yuansu-protium-separator.name = 氕气分离机
block.yuansu-protium-separator.description = 通过电解分离工艺，从氢气中提取高纯度氕气。

liquid.yuansu-deuterium.name = 氘气
liquid.yuansu-deuterium.description = 氢的稳定同位素，含一个质子和一个中子，又称重氢，从氢气中分离得到。
block.yuansu-deuterium-separator.name = 氘气分离机
block.yuansu-deuterium-separator.description = 通过多级精馏工艺，从氢气中提取稀有氘气，效率较低。

liquid.yuansu-tritium.name = 氚气
liquid.yuansu-tritium.description = 氢的放射性同位素，含一个质子和两个中子，具有微弱放射性，从氢气中极难分离。
block.yuansu-tritium-separator.name = 氚气分离机
block.yuansu-tritium-separator.description = 通过高精度同位素分离工艺，从氢气中提取微量氚气，需要高级材料。
