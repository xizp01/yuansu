liquid.yuansu-oxygen.name = 氧气
liquid.yuansu-oxygen.description = 氧气，水电解产物之一，无色无味的气体，支持燃烧和生命活动，可用于氧化反应和医疗用途。
liquid.yuansu-protium.name = 氕气
liquid.yuansu-protium.description = 氕气（轻氢），基础能源气体，可做燃料、化工原料；聚变反应很难直接使用，需要分离氘氚。
block.yuansu-protium-separator.name = 氕气分离机
block.yuansu-protium-separator.description = 通过电解分离工艺，从氢气中提取高纯度氕气，是同位素分离的基础设备。
liquid.yuansu-deuterium.name = 氘气
liquid.yuansu-deuterium.description = 氘气（重氢），氢的稳定同位素，核聚变的主要燃料之一，可用于中子慢化剂和特种化工，在自然界中含量极低，需多级精馏分离。
block.yuansu-deuterium-separator.name = 氘气分离机
block.yuansu-deuterium-separator.description = 通过多级精馏工艺，从氢气中提取稀有氘气，效率较低，需要玻璃等耐腐蚀材料。
liquid.yuansu-tritium.name = 氚气
liquid.yuansu-tritium.description = 氚气（超重氢），氢的放射性同位素，核聚变的关键燃料，半衰期约12.3年，需通过人工辐照或从氢气中极微量分离获得，具有微弱放射性。
block.yuansu-tritium-separator.name = 氚气分离机
block.yuansu-tritium-separator.description = 通过高精度同位素分离工艺，从氢气中提取微量氚气，需要 surge 合金等高级材料，产量极低。
block.yuansu-serpulo-electrolyzer.name = 电解制氢机
block.yuansu-serpulo-electrolyzer.description = 塞普罗专用设备，通过电解水同时制取氢气和氧气（比例2:1），为同位素分离产业链提供原料。
item.yuansu-silica-gel.name = 硅胶干燥剂
item.yuansu-silica-gel.description = 多孔二氧化硅颗粒，中高湿度环境吸水能力强，再生温度80-120℃，用于除湿转轮取水器的消耗品。
item.yuansu-lithium-chloride.name = 氯化锂干燥剂
item.yuansu-lithium-chloride.description = 吸湿性盐，极低湿度（RH 20%）仍能捕获水汽，再生温度较高，用于氯化锂复合吸附集水器的消耗品。
item.yuansu-mof-material.name = MOF材料
item.yuansu-mof-material.description = 金属有机框架材料，超大比表面积（1克可达7000㎡），纳米孔洞精确抓取水分子，再生温度低可利用太阳能，全湿度区间稳定工作。
block.yuansu-silica-gel-synthesizer.name = 硅胶合成机
block.yuansu-silica-gel-synthesizer.description = 利用二氧化硅（沙子）制造多孔硅胶干燥剂，为除湿转轮取水器提供耗材。
block.yuansu-condensation-water-collector.name = 空气冷凝取水器
block.yuansu-condensation-water-collector.description = 一代空气取水设备，压缩制冷路线，蒸发器表面降温使水汽凝结。耗电量高，湿度≥50满速，35-50半速，低于35只有20%产量，干燥星球效率暴跌。
block.yuansu-desiccant-wheel-collector.name = 除湿转轮取水器
block.yuansu-desiccant-wheel-collector.description = 二代空气取水设备，硅胶转轮连续吸附-热风再生循环，消耗硅胶干燥剂。湿度≥25即可满速工作，低于25只有40%产量，适合半干旱星球。
block.yuansu-lithium-chloride-collector.name = 氯化锂吸附集水器
block.yuansu-lithium-chloride-collector.description = 三代空气取水设备，盐-多孔载体复合吸附剂双床间歇循环，消耗氯化锂干燥剂。湿度>15即可满负荷，低于15只有30%产量，干旱星球主力供水设备。
block.yuansu-mof-water-collector.name = MOF光热取水器
block.yuansu-mof-water-collector.description = 四代终极空气取水设备，MOF材料超大比表面积精确抓取水分子，太阳能光热加热解吸。全湿度区间稳定工作（最低85%产量），仅风机耗电极低，外星前哨终极供水方案。
block.yuansu-fog-water-collector.name = 雾水收集栅格
block.yuansu-fog-water-collector.description = 零耗电被动设备，通过细密网格拦截空气中的雾滴汇聚成水。只有湿度≥90的多雾环境才工作，湿度不足完全停止产出，适合海岛多雾星球开局应急水源。
