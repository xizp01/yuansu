liquid.yuansu-oxygen.name = Oxygen
liquid.yuansu-oxygen.description = Oxygen, one of the products of water electrolysis, a colorless and odorless gas that supports combustion and life, used in oxidation reactions and medical applications.
liquid.yuansu-protium.name = Protium
liquid.yuansu-protium.description = Protium (light hydrogen), a basic energy gas used as fuel and chemical feedstock; not directly usable for fusion, requires deuterium and tritium separation.
block.yuansu-protium-separator.name = Protium Separator
block.yuansu-protium-separator.description = Extracts high-purity protium from hydrogen gas via electrolytic separation, the foundational isotope separation device.

liquid.yuansu-deuterium.name = Deuterium
liquid.yuansu-deuterium.description = Deuterium (heavy hydrogen), a stable isotope of hydrogen and primary fusion fuel, used as neutron moderator and in specialty chemistry; extremely rare in nature, requires multi-stage distillation.
block.yuansu-deuterium-separator.name = Deuterium Separator
block.yuansu-deuterium-separator.description = Extracts rare deuterium from hydrogen gas via multi-stage distillation, low efficiency, requires corrosion-resistant materials like metaglass.

liquid.yuansu-tritium.name = Tritium
liquid.yuansu-tritium.description = Tritium (super-heavy hydrogen), a radioactive isotope of hydrogen and critical fusion fuel, half-life ~12.3 years, obtained via artificial irradiation or trace separation from hydrogen, weakly radioactive.
block.yuansu-tritium-separator.name = Tritium Separator
block.yuansu-tritium-separator.description = Extracts trace amounts of tritium from hydrogen gas via high-precision isotope separation, requires advanced materials like surge alloy, extremely low yield.

block.yuansu-serpulo-electrolyzer.name = Hydrogen Electrolyzer
block.yuansu-serpulo-electrolyzer.description = Serpulo-only device that produces both hydrogen and oxygen (2:1 ratio) via water electrolysis, supplying the isotope separation chain.

status.yuansu-radiation.name = Radiation
status.yuansu-radiation.description = Continuous damage from radioactive material, reduces health regen and movement speed. Applied by radioactive substances like tritium.
