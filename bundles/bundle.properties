liquid.yuansu-protium.name = Protium
liquid.yuansu-protium.description = The lightest isotope of hydrogen, separated from hydrogen gas.
block.yuansu-protium-separator.name = Protium Separator
block.yuansu-protium-separator.description = Separates high-purity protium from hydrogen gas.

liquid.yuansu-deuterium.name = Deuterium
liquid.yuansu-deuterium.description = A stable isotope of hydrogen with one neutron, also known as heavy hydrogen.
block.yuansu-deuterium-separator.name = Deuterium Separator
block.yuansu-deuterium-separator.description = Extracts rare deuterium from hydrogen gas via multi-stage distillation.

liquid.yuansu-tritium.name = Tritium
liquid.yuansu-tritium.description = A radioactive isotope of hydrogen with two neutrons, extremely rare and hard to separate.
block.yuansu-tritium-separator.name = Tritium Separator
block.yuansu-tritium-separator.description = Extracts trace amounts of tritium from hydrogen gas, requiring advanced materials.
