liquid.yuansu-oxygen.name = Oxygen
liquid.yuansu-oxygen.description = Oxygen, one of the products of water electrolysis, a colorless and odorless gas that supports combustion and life, used in oxidation reactions and medical applications.
liquid.yuansu-protium.name = Protium
liquid.yuansu-protium.description = Protium (light hydrogen), a basic energy gas used as fuel and chemical feedstock; not directly usable for fusion, requires deuterium and tritium separation.
block.yuansu-protium-separator.name = Protium Separator
block.yuansu-protium-separator.description = Extracts high-purity protium from hydrogen gas via electrolytic separation, the foundational isotope separation device.
liquid.yuansu-deuterium.name = Deuterium
liquid.yuansu-deuterium.description = Deuterium (heavy hydrogen), a stable isotope of hydrogen and primary fusion fuel, used as neutron moderator and in specialty chemistry; extremely rare in nature, requires multi-stage distillation.
block.yuansu-deuterium-separator.name = Deuterium Separator
block.yuansu-deuterium-separator.description = Extracts rare deuterium from hydrogen gas via multi-stage distillation, low efficiency, requires corrosion-resistant materials like metaglass.
liquid.yuansu-tritium.name = Tritium
liquid.yuansu-tritium.description = Tritium (super-heavy hydrogen), a radioactive isotope of hydrogen and critical fusion fuel, half-life ~12.3 years, obtained via artificial irradiation or trace separation from hydrogen, weakly radioactive.
block.yuansu-tritium-separator.name = Tritium Separator
block.yuansu-tritium-separator.description = Extracts trace amounts of tritium from hydrogen gas via high-precision isotope separation, requires advanced materials like surge alloy, extremely low yield.
block.yuansu-serpulo-electrolyzer.name = Hydrogen Electrolyzer
block.yuansu-serpulo-electrolyzer.description = Serpulo-only device that produces both hydrogen and oxygen (2:1 ratio) via water electrolysis, supplying the isotope separation chain.
item.yuansu-silica-gel.name = Silica Gel Desiccant
item.yuansu-silica-gel.description = Porous silica particles, strong water absorption in medium-high humidity, regeneration temperature 80-120°C, used as consumable for desiccant wheel water collector.
item.yuansu-lithium-chloride.name = Lithium Chloride Desiccant
item.yuansu-lithium-chloride.description = Hygroscopic salt, captures water vapor even at very low humidity (RH 20%), high regeneration temperature, used as consumable for lithium chloride water collector.
item.yuansu-mof-material.name = MOF Material
item.yuansu-mof-material.description = Metal-organic framework material, ultra-high surface area (up to 7000 m²/g), nanopores precisely capture water molecules, low regeneration temperature using solar heat, stable across all humidity ranges.
block.yuansu-silica-gel-synthesizer.name = Silica Gel Synthesizer
block.yuansu-silica-gel-synthesizer.description = Produces porous silica gel desiccant from sand (silicon dioxide), supplies consumables for desiccant wheel water collector.
block.yuansu-condensation-water-collector.name = Condensation Water Collector
block.yuansu-condensation-water-collector.description = Tier 1 AWH device, compressor refrigeration, water vapor condenses on cold evaporator surface. High power consumption, full speed at humidity≥50, 50% at 35-50, only 20% below 35, inefficient on arid planets.
block.yuansu-desiccant-wheel-collector.name = Desiccant Wheel Collector
block.yuansu-desiccant-wheel-collector.description = Tier 2 AWH device, silica wheel continuous adsorption-hot air regeneration cycle, consumes silica gel. Full speed at humidity≥25, only 40% below 25, suitable for semi-arid planets.
block.yuansu-lithium-chloride-collector.name = Lithium Chloride Collector
block.yuansu-lithium-chloride-collector.description = Tier 3 AWH device, salt-porous composite adsorbent dual-bed cycle, consumes lithium chloride. Full load at humidity>15, only 30% below 15, primary water supply for arid planets.
block.yuansu-mof-water-collector.name = MOF Solar Thermal Collector
block.yuansu-mof-water-collector.description = Tier 4 ultimate AWH device, MOF material ultra-high surface area captures water molecules, solar thermal desorption. Stable across all humidity (min 85% output), extremely low power (fan only), ultimate water supply for alien outposts.
block.yuansu-fog-water-collector.name = Fog Water Collector
block.yuansu-fog-water-collector.description = Zero-power passive device, intercepts fog droplets via fine mesh. Only operates at humidity≥90, completely stops below 90, suitable as emergency water source on foggy islands.
